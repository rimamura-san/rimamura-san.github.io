<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複数OA優先順位テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: auto;
      padding: 20px;
      background: #f3f4f6;
    }

    section {
      margin-bottom: 16px;
      padding: 16px;
      border-radius: 10px;
      background: white;
    }

    select,
    button {
      box-sizing: border-box;
      width: 100%;
      margin: 6px 0;
      padding: 12px;
    }

    button {
      color: white;
      border: 0;
      border-radius: 6px;
      background: #06c755;
      font-weight: bold;
    }

    .secondary {
      background: #2563eb;
    }

    pre {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <h1>複数OAの指定方法テスト</h1>

  <section>
    <h2>現在の起動条件</h2>
    <pre id="startup">確認中...</pre>
  </section>

  <section>
    <h2>導線①：prompt_bot_id</h2>

    <p>
      選択したOAをprompt_bot_idに指定して、
      ミニアプリを開き直します。
    </p>

    <select id="prompt-bot">
      <option value="@410craoz">
        rimamuraOA（@410craoz）
      </option>
      <option value="@747ltofe">
        rimamuraSTORE（@747ltofe）
      </option>
    </select>

    <button id="open-prompt">
      prompt_bot_id付きで開き直す
    </button>
  </section>

  <section>
    <h2>導線②：permission.requestAll()</h2>

    <p>
      起動時とは異なるOAを選び、権限追加画面で
      どちらのOAが表示されるか確認します。
    </p>

    <select id="request-all-bot">
      <option value="@747ltofe">
        rimamuraSTORE（@747ltofe）
      </option>
      <option value="@410craoz">
        rimamuraOA（@410craoz）
      </option>
    </select>

    <button id="request-all" class="secondary" disabled>
      requestAll()を実行
    </button>
  </section>

  <section>
    <h2>導線③：requestFriendship()</h2>

    <select id="friendship-bot">
      <option value="@747ltofe">
        rimamuraSTORE（@747ltofe）
      </option>
      <option value="@410craoz">
        rimamuraOA（@410craoz）
      </option>
    </select>

    <button id="request-friendship" disabled>
      requestFriendship()を実行
    </button>
  </section>

  <section>
    <h2>実行結果</h2>
    <pre id="result">LIFFを初期化しています...</pre>
  </section>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = "2010552506-d2NuY6Vo";

    const startupEl = document.getElementById("startup");
    const resultEl = document.getElementById("result");

    const requestAllButton =
      document.getElementById("request-all");

    const requestFriendshipButton =
      document.getElementById("request-friendship");

    function showResult(message, data) {
      resultEl.textContent =
        message +
        (data
          ? "\n\n" + JSON.stringify(data, null, 2)
          : "");
    }

    function showError(method, error) {
      showResult(`${method}でエラーが発生しました`, {
        code: error?.code,
        message: error?.message || String(error)
      });
    }

    function getPromptBotId() {
      const params =
        new URLSearchParams(location.search);

      return params.get("prompt_bot_id");
    }

    function makeMiniAppUrl(botId) {
      const url =
        new URL(`https://miniapp.line.me/${LIFF_ID}`);

      url.searchParams.set("prompt_bot_id", botId);

      return url.toString();
    }

    document
      .getElementById("open-prompt")
      .addEventListener("click", () => {
        const botId =
          document.getElementById("prompt-bot").value;

        location.href = makeMiniAppUrl(botId);
      });

    requestAllButton.addEventListener(
      "click",
      async () => {
        const botId =
          document.getElementById(
            "request-all-bot"
          ).value;

        showResult(
          `requestAll()を実行します\n指定OA：${botId}`
        );

        try {
          const response =
            await liff.permission.requestAll({
              officialAccount: {
                id: botId,
                fallback: false
              }
            });

          showResult(
            `requestAll()が完了しました\n指定OA：${botId}`,
            response
          );
        } catch (error) {
          showError(
            "liff.permission.requestAll()",
            error
          );
        }
      }
    );

    requestFriendshipButton.addEventListener(
      "click",
      async () => {
        const botId =
          document.getElementById(
            "friendship-bot"
          ).value;

        showResult(
          `requestFriendship()を実行します\n指定OA：${botId}`
        );

        try {
          const response =
            await liff.requestFriendship({
              officialAccount: {
                id: botId,
                fallback: false
              }
            });

          showResult(
            `requestFriendship()が完了しました\n指定OA：${botId}`,
            response
          );
        } catch (error) {
          showError(
            "liff.requestFriendship()",
            error
          );
        }
      }
    );

    async function initialize() {
      const promptBotId = getPromptBotId();

      startupEl.textContent =
        `LIFF ID：${LIFF_ID}\n` +
        `prompt_bot_id：${promptBotId || "指定なし"}\n` +
        `URL：${location.href}`;

      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: location.href
          });

          return;
        }

        requestAllButton.disabled = false;
        requestFriendshipButton.disabled = false;

        showResult(
          "LIFF初期化成功",
          {
            liffVersion: liff.getVersion(),
            isInClient: liff.isInClient(),
            promptBotId
          }
        );
      } catch (error) {
        showError("liff.init()", error);
      }
    }

    initialize();
  </script>
</body>
</html>
