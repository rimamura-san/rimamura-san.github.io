<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINE Login 公式アカウント切替テスト</title>
    <style>
      body {
        max-width: 680px;
        margin: 0 auto;
        padding: 32px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
      }

      h1 {
        font-size: 24px;
      }

      p {
        line-height: 1.6;
      }

      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #06c755;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      label {
        display: block;
        margin: 24px 0;
      }

      #result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 8px;
        background: #f3f4f6;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>LINE Login 公式アカウント切替テスト</h1>

    <p>
      連携する公式アカウントを変更した後、すでに認可済みのユーザーに表示される画面を確認します。
    </p>

    <label>
      <input id="force-consent" type="checkbox" />
      <code>prompt=consent</code> を付けて認可画面を強制表示する
    </label>

    <button id="login-button" type="button">LINE Loginを開始</button>

    <div id="result" aria-live="polite">ログイン開始前です。</div>

    <script src="./main.js"></script>
  </body>
</html>
